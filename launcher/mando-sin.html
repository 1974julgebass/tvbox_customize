<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070B">
<title>Mando</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(600px 420px at 10% -10%, rgba(91, 140, 255, .25), transparent 70%), #05070B;
    color: #fff; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .caja { max-width: 400px; text-align: center; }
  svg { width: 64px; height: 64px; color: #5B8CFF; margin-bottom: 18px; }
  h1 { font-size: 25px; margin-bottom: 10px; }
  p { color: rgba(255, 255, 255, .72); }
  ol { text-align: left; margin: 20px auto 0; padding-left: 22px; color: rgba(255, 255, 255, .85); }
  li { margin: 6px 0; }
  b { color: #fff; }
</style>
</head>
<body>
<main class="caja">
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="8" height="8" rx="1.5"/><rect x="19" y="5" width="8" height="8" rx="1.5"/><rect x="5" y="19" width="8" height="8" rx="1.5"/><path d="M19 19h3v3h-3zM24 24h3v3h-3zM19 26v1M26 19v1"/></svg>
  <h1>Escanea el código de la tele</h1>
  <p>Este mando solo funciona en los móviles emparejados, o el código ya se usó o caducó (duran 5 minutos).</p>
  <ol>
    <li>En la pantalla de inicio de la tele, abre <b>Ajustes</b>.</li>
    <li>Elige <b>Usar el móvil</b>: saldrá un código QR.</li>
    <li>Escanéalo con la cámara de este móvil.</li>
  </ol>
</main>
</body>
</html>
